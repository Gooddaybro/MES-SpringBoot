
server:
  port: 9090

spring:
  flyway:
    enabled: true
  mvc:
    static-path-pattern: /**
    view:
      prefix: /templates/
      suffix: .ftl

  freemarker:
    suffix: .ftl
    template-encoding: UTF-8
    template-loader-path: classpath:/templates/
    cache: false
    expose-spring-macro-helpers: false
    request-context-attribute: request
    settings:
      classic_compatible: true

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mes_study?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MES_DB_USERNAME:root}
    password: ${MES_DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 2
      max-active: 10
      query-timeout: 6000
      transaction-query-timeout: 6000
      remove-abandoned-timeout: 1800
      filters: stat,config

  redis:
    host: 127.0.0.1
    port: 6379
    password:
    timeout: 10000
    jedis:
      pool:
        max-idle: 8
        min-idle: 2
        max-active: 100
        max-wait: -1

logging:
  config: classpath:logback.xml
  level:
    root: INFO
    com.wangziyang: DEBUG
