[project]
name = "mes-knowledge-agent"
version = "0.1.0"
description = "Signed internal LangGraph and page-grounded MES document retrieval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "chromadb>=1.0,<2",
  "pypdf>=6,<7",
  "fonttools>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "reportlab>=4,<5"]

[project.scripts]
mes-rag = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:.*builtin type.*:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
